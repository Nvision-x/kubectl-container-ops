name: Build and Push kubectl Container

# Grant necessary permissions for the workflow
permissions:
  contents: read
  pull-requests: read
  packages: write
  actions: read

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
  pull_request:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
  workflow_dispatch:
    inputs:
      kubectl_version:
        description: 'kubectl version to build'
        required: false
        default: 'v1.34.1'
      enable_security_scan:
        description: 'Enable security scanning'
        required: false
        type: boolean
        default: true
      enable_push:
        description: 'Enable push to registry'
        required: false
        type: boolean
        default: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  KUBECTL_VERSION: v1.34.1
  PLATFORMS: linux/amd64,linux/arm64

jobs:
  validate:
    name: Code Quality & Linting
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    timeout-minutes: 10
    outputs:
      dockerfile-changed: ${{ steps.changes.outputs.dockerfile }}
      entrypoint-changed: ${{ steps.changes.outputs.entrypoint }}
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Check for relevant changes
      uses: dorny/paths-filter@v2
      id: changes
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        filters: |
          dockerfile:
            - 'Dockerfile*'
            - '.dockerignore'
          entrypoint:
            - 'entrypoint.sh'
          makefile:
            - 'Makefile'
          workflows:
            - '.github/workflows/**'
            - '.github/workflows/**'

    - name: Lint Dockerfile
      uses: hadolint/hadolint-action@v3.1.0
      with:
        dockerfile: Dockerfile
        failure-threshold: warning
        ignore: DL3008,DL3009,DL3018,DL3002

    - name: Lint shell scripts
      run: |
        sudo apt-get update && sudo apt-get install -y shellcheck
        find . -name "*.sh" -type f -exec shellcheck {} +

    - name: Validate Makefile
      if: steps.changes.outputs.makefile == 'true'
      run: |
        # Check for GNU Make compatibility
        make --version
        # Validate syntax
        make -n help > /dev/null

    - name: Check file permissions
      run: |
        # Ensure scripts have execute permissions
        [ -x entrypoint.sh ] || { echo "entrypoint.sh not executable"; exit 1; }
        
        # Check for sensitive files
        SENSITIVE_FILES=$(find . -name "*.key" -o -name "*.pem" -o -name "*.p12" | head -5)
        if [ -n "$SENSITIVE_FILES" ]; then
          echo "Found sensitive files in repository:"
          echo "$SENSITIVE_FILES"
          exit 1
        fi

  security-scan:
    name: Security Scanning
    runs-on: ubuntu-latest
    needs: validate
    if: ${{ github.event.inputs.enable_security_scan != 'false' }}
    permissions:
      security-events: write
      actions: read
      contents: read
    timeout-minutes: 15
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Security scanning info
      run: |
        echo "🔍 Running Trivy security scans (filesystem and secrets)"
        echo "� Results will be displayed in workflow logs"
        echo "ℹ️  SARIF upload is disabled - scans run for visibility only"

    - name: Run Trivy vulnerability scanner (filesystem)
      id: trivy-fs
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        scan-ref: '.'
        format: 'table'
        severity: 'CRITICAL,HIGH,MEDIUM'
      continue-on-error: true

    - name: Run Trivy secret scanner
      id: trivy-secrets
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        scan-ref: '.'
        scanners: 'secret'
        format: 'table'
      continue-on-error: true

  build-and-push:
    name: Build & Push Container
    runs-on: ubuntu-latest
    needs: validate
    if: ${{ github.event_name != 'pull_request' || github.event.inputs.enable_push != 'false' }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      image-digest: ${{ steps.build.outputs.digest }}
      image-tags: ${{ steps.meta.outputs.tags }}
      calver-tag: ${{ steps.calver.outputs.tag }}
      calver-version: ${{ steps.calver.outputs.version }}
      
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Generate CalVer tag
      id: calver
      run: |
        # Get today's date
        TODAY=$(date +%Y.%m.%d)
        echo "Today's date: $TODAY"
        
        # Get existing releases for today using GitHub API
        echo "Checking existing releases for $TODAY..."
        EXISTING_RELEASES=$(curl -s \
          -H "Accept: application/vnd.github+json" \
          -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
          -H "X-GitHub-Api-Version: 2022-11-28" \
          "https://api.github.com/repos/${{ github.repository }}/releases" | \
          jq -r --arg today "$TODAY" '[.[] | select(.tag_name | test("^v" + $today + "-[0-9]+$")) | .tag_name] | length' 2>/dev/null || echo "0")
        
        # Ensure we have a number
        if ! [[ "$EXISTING_RELEASES" =~ ^[0-9]+$ ]]; then
          echo "Warning: Could not determine existing releases, defaulting to 0"
          EXISTING_RELEASES=0
        fi
        
        # Calculate next build number for today (starting from 1)
        BUILD_NUMBER=$((EXISTING_RELEASES + 1))
        
        # Generate CalVer tag
        CALVER_TAG="${TODAY}-${BUILD_NUMBER}"
        echo "tag=v${CALVER_TAG}" >> $GITHUB_OUTPUT
        echo "version=${CALVER_TAG}" >> $GITHUB_OUTPUT
        echo "Generated CalVer tag: v${CALVER_TAG} (build #${BUILD_NUMBER} for ${TODAY})"
        echo "Found ${EXISTING_RELEASES} existing releases for today"

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Container Registry for Pull/Build
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ben-nvisionx
        password: ${{ secrets.DEPLOYMENT_PAT }}

    - name: Verify Docker authentication
      run: |
        echo "Verifying Docker authentication..."
        docker system info | grep -E 'Registry|Username' || true
        echo "Testing registry access..."
        docker manifest inspect ghcr.io/nvision-x/alpine-base-dockerfile:latest > /dev/null 2>&1 && echo "✓ Can access private registry" || echo "✗ Cannot access private registry"

    - name: Pre-pull base image
      run: |
        echo "Pre-pulling base image to ensure access with DEPLOYMENT_PAT..."
        docker pull ghcr.io/nvision-x/alpine-base-dockerfile@sha256:e1c87245f926bdc2b2c694f0771f561ed07af4ded7e1037a7af8d8a897d9c9d5
        echo "✓ Base image pulled successfully"

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=semver,pattern={{version}}
          type=raw,value=latest,enable={{is_default_branch}}
          type=raw,value=kubectl-${{ env.KUBECTL_VERSION }},enable={{is_default_branch}}
          type=raw,value=${{ steps.calver.outputs.version }},enable={{is_default_branch}}
        labels: |
          org.opencontainers.image.title=kubectl-container-ops
          org.opencontainers.image.description=Lightweight kubectl container with DevOps tools
          kubectl.version=${{ env.KUBECTL_VERSION }}
          calver.version=${{ steps.calver.outputs.version }}
          calver.tag=${{ steps.calver.outputs.tag }}

    - name: Build image
      id: build
      uses: docker/build-push-action@v5
      with:
        context: .
        platforms: linux/amd64
        push: false
        load: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        build-args: |
          KUBECTL_VERSION=${{ env.KUBECTL_VERSION }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Logout from previous registry session
      if: github.event_name != 'pull_request'
      run: docker logout ${{ env.REGISTRY }}

    - name: Logout from previous registry session
      if: github.event_name != 'pull_request'
      run: docker logout ${{ env.REGISTRY }}

    - name: Log in to Container Registry for Push
      if: github.event_name != 'pull_request'
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Push image
      if: github.event_name != 'pull_request'
      uses: docker/build-push-action@v5
      with:
        context: .
        platforms: ${{ env.PLATFORMS }}
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        build-args: |
          KUBECTL_VERSION=${{ env.KUBECTL_VERSION }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

  auto-release:
    name: Create CalVer Release
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Create CalVer release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: ${{ needs.build-and-push.outputs.calver-tag }}
        name: kubectl Container ${{ needs.build-and-push.outputs.calver-tag }}
        generate_release_notes: true
        body: |
          ## kubectl Container CalVer Release ${{ needs.build-and-push.outputs.calver-tag }}
          
          ### 📅 Automatic CalVer Release
          - **CalVer Version**: `${{ needs.build-and-push.outputs.calver-version }}`
          - **Build Date**: $(date +%Y-%m-%d)
          - **Build Number**: #${{ github.run_number }}
          - **kubectl Version**: **${{ env.KUBECTL_VERSION }}**
          
          ### 📦 Container Images
          ```bash
          # Pull CalVer tagged image
          docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.build-and-push.outputs.calver-version }}
          
          # Pull latest
          docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          ```
          
          ### 🔧 Quick Usage
          ```bash
          # Quick test
          docker run --rm ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.build-and-push.outputs.calver-version }} version --client
          
          # With kubeconfig
          docker run --rm -v ~/.kube/config:/.kube/config:ro \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.build-and-push.outputs.calver-version }} get nodes
          ```
          
          ### 📊 Build Details
          - **Image Digest**: `${{ needs.build-and-push.outputs.image-digest }}`
          - **Commit**: ${{ github.sha }}
          - **Platform**: linux/amd64

  notify-completion:
    name: Build Summary
    runs-on: ubuntu-latest
    needs: [validate, build-and-push, auto-release]
    if: always()
    timeout-minutes: 5
    
    steps:
    - name: Build Summary
      run: |
        echo "## 🚀 kubectl Container Build Complete" >> $GITHUB_STEP_SUMMARY
        echo "### Build Results" >> $GITHUB_STEP_SUMMARY
        echo "- **Status**: ${{ needs.build-and-push.result }}" >> $GITHUB_STEP_SUMMARY
        echo "- **kubectl Version**: \`${{ env.KUBECTL_VERSION }}\`" >> $GITHUB_STEP_SUMMARY
        echo "- **Platform**: linux/amd64" >> $GITHUB_STEP_SUMMARY
        
        if [ "${{ needs.build-and-push.result }}" = "success" ]; then
          echo "✅ Build completed successfully" >> $GITHUB_STEP_SUMMARY
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "- **Image**: \`${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}\`" >> $GITHUB_STEP_SUMMARY
            
            if [ "${{ github.ref }}" = "refs/heads/main" ]; then
              echo "- **CalVer Release**: \`${{ needs.build-and-push.outputs.calver-tag }}\`" >> $GITHUB_STEP_SUMMARY
              echo "- **Auto-Release**: ${{ needs.auto-release.result == 'success' && '✅' || needs.auto-release.result == 'skipped' && '⏭️' || '❌' }} ${{ needs.auto-release.result }}" >> $GITHUB_STEP_SUMMARY
            fi
          fi
        else
          echo "❌ Build failed" >> $GITHUB_STEP_SUMMARY
        fi